<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доступ запрещён — Autopilot Content</title>
    <!-- FIX (Промпт 4): локальные стили вместо внешних CDN (см. account_blocked.html) -->
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white rounded-lg shadow-lg max-w-lg w-full p-8 text-center">
        <div class="text-6xl mb-4">🔐</div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Доступ запрещён</h1>
        <p class="text-gray-600 mb-6">
            У вас нет прав администратора. Если вы считаете, что это ошибка,
            свяжитесь с администратором системы.
            {% if user and user.email %}
                <br><span class="text-sm text-gray-500">Учётная запись: {{ user.email }}</span>
            {% endif %}
        </p>

        <div class="flex justify-center gap-4">
            <a href="/"
               class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-md transition duration-200">
                На главную
            </a>
            <a href="/logout"
               class="inline-block bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-6 rounded-md transition duration-200">
                Выйти
            </a>
        </div>
    </div>
</body>
</html>
