<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Панель администратора — Autopilot Content{% endblock %}</title>
    <!-- FIX: Tailwind Play CDN заменён на локальный styles.css -->
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="flex min-h-screen">
        <!-- Сайдбар -->
        <aside class="w-64 flex-shrink-0 bg-gray-800 text-white flex flex-col">
            <div class="px-6 py-6 border-b border-gray-700">
                <h2 class="text-xl font-bold">🛠️ Админ-панель</h2>
                <p class="text-sm text-gray-400 mt-1 truncate">{{ admin.email }}</p>
            </div>
            <nav class="flex-1 px-3 py-4 space-y-1">
                <a href="/admin"
                   class="block px-4 py-2 rounded-md transition duration-200 {% if request.url.path == '/admin' %}bg-gray-900 text-white font-semibold{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
                    📊 Дашборд
                </a>
                <a href="/admin/users"
                   class="block px-4 py-2 rounded-md transition duration-200 {% if request.url.path.startswith('/admin/users') %}bg-gray-900 text-white font-semibold{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
                    👥 Пользователи
                </a>
                <a href="/admin/communities"
                   class="block px-4 py-2 rounded-md transition duration-200 {% if request.url.path.startswith('/admin/communities') %}bg-gray-900 text-white font-semibold{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
                    🌐 Сообщества
                </a>
                <a href="/admin/settings"
                   class="block px-4 py-2 rounded-md transition duration-200 {% if request.url.path.startswith('/admin/settings') %}bg-gray-900 text-white font-semibold{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
                    ⚙️ Настройки AI
                </a>
            </nav>
            <div class="px-3 py-4 border-t border-gray-700">
                <a href="/"
                   class="block px-4 py-2 rounded-md text-gray-300 hover:bg-gray-700 hover:text-white transition duration-200">
                    ← Вернуться в приложение
                </a>
            </div>
        </aside>

        <!-- Основной контент -->
        <main class="flex-1 bg-gray-100 p-8 overflow-x-auto">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
